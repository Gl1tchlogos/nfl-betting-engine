name: Validate NFL import

on:
  push:
    branches: [main]
    paths:
      - "ingestion/**"
      - ".github/workflows/import-validation.yml"
  pull_request:
    branches: [main]
    paths:
      - "ingestion/**"
      - ".github/workflows/import-validation.yml"
      - "validation-trigger*.txt"
  workflow_dispatch:

jobs:
  validate-import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install importer dependencies
        run: pip -q install "pandas>=2.2" "pyarrow>=17" "httpx>=0.27"

      - name: Verify Supabase Data API access
        id: connection
        env:
          SUPABASE_URL: https://rhesgemopvbtwgcytapq.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          mkdir -p diagnostics
          python - <<'PY' > diagnostics/connection.txt 2>&1
          import os
          import sys
          import httpx

          url = os.environ.get("SUPABASE_URL", "").rstrip("/")
          key = os.environ.get("SUPABASE_SECRET_KEY", "").strip()
          if not key:
              print("result=failed")
              print("reason=SUPABASE_SECRET_KEY is missing")
              sys.exit(1)
          if not key.startswith("sb_secret_"):
              print("result=failed")
              print("reason=The saved value is not a Supabase secret key")
              sys.exit(1)

          response = httpx.get(
              f"{url}/rest/v1/games",
              params={"select": "game_id", "limit": "1"},
              headers={"apikey": key},
              timeout=30,
          )
          print(f"status_code={response.status_code}")
          if response.is_error:
              print(f"error={response.text[-1000:]}")
              sys.exit(1)
          print("result=success")
          PY

      - name: Upload connection diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: connection-diagnostics
          path: diagnostics/connection.txt
          retention-days: 1

      - name: Import 2025 validation season
        id: import
        continue-on-error: true
        env:
          SUPABASE_URL: https://rhesgemopvbtwgcytapq.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          mkdir -p diagnostics
          python -m ingestion.load_nflverse --start-season 2025 --end-season 2025 > diagnostics/import.txt 2>&1

      - name: Upload import diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: import-diagnostics
          path: diagnostics/import.txt
          if-no-files-found: ignore
          retention-days: 1

      - name: Fail when import validation failed
        if: always()
        run: test "${{ steps.import.outcome }}" = "success"
