name: Validate NFL import

on:
  push:
    branches: [main]
    paths:
      - "ingestion/**"
      - ".github/workflows/import-validation.yml"
  workflow_dispatch:

jobs:
  validate-import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install importer dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "sqlalchemy>=2.0" "psycopg[binary]>=3.2" "pandas>=2.2" "pyarrow>=17" "httpx>=0.27"
      - name: Verify database connection
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python - <<'PY'
          import os
          import sys
          from sqlalchemy import create_engine, text

          url = os.environ.get("DATABASE_URL", "")
          if not url:
              print("DATABASE_URL secret is missing")
              sys.exit(1)
          if "YOUR-PASSWORD" in url or "CHANGE_ME" in url:
              print("DATABASE_URL still contains the password placeholder")
              sys.exit(1)
          if url.startswith("postgresql://"):
              url = url.replace("postgresql://", "postgresql+psycopg://", 1)
          try:
              engine = create_engine(url, pool_pre_ping=True, connect_args={"connect_timeout": 15})
              with engine.connect() as connection:
                  connection.execute(text("select 1"))
              print("Database connection succeeded")
          except Exception as exc:
              print(f"Database connection failed: {type(exc).__name__}")
              print(str(exc).splitlines()[-1])
              sys.exit(1)
          PY
      - name: Import 2025 validation season
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set +e
          python -m ingestion.load_nflverse --start-season 2025 --end-season 2025 > import.log 2>&1
          code=$?
          tail -n 100 import.log
          exit $code
