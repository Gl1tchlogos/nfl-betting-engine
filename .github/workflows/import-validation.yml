name: Validate NFL import

on:
  push:
    branches: [main]
    paths:
      - "ingestion/**"
      - ".github/workflows/import-validation.yml"
  workflow_dispatch:

jobs:
  validate-import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install importer dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "sqlalchemy>=2.0" "psycopg[binary]>=3.2" "pandas>=2.2" "pyarrow>=17" "httpx>=0.27"
      - name: Import 2025 validation season
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m ingestion.load_nflverse --start-season 2025 --end-season 2025
