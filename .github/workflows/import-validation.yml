name: Validate NFL import

on:
  push:
    branches: [main]
    paths:
      - "ingestion/**"
      - ".github/workflows/import-validation.yml"
  pull_request:
    branches: [main]
    paths:
      - "ingestion/**"
      - ".github/workflows/import-validation.yml"
      - "validation-trigger.txt"
  workflow_dispatch:

jobs:
  validate-import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install importer dependencies
        run: pip -q install "sqlalchemy>=2.0" "psycopg[binary]>=3.2" "pandas>=2.2" "pyarrow>=17" "httpx>=0.27"

      - name: Verify database connection
        id: connection
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          mkdir -p diagnostics
          python - <<'PY' > diagnostics/connection.txt 2>&1
          import os
          import sys
          from urllib.parse import urlsplit
          from sqlalchemy import create_engine, text

          raw = os.environ.get("DATABASE_URL", "")
          if not raw:
              print("result=failed")
              print("reason=DATABASE_URL secret is missing")
              sys.exit(1)
          if "YOUR-PASSWORD" in raw or "CHANGE_ME" in raw or "[YOUR-PASSWORD]" in raw:
              print("result=failed")
              print("reason=DATABASE_URL still contains the password placeholder")
              sys.exit(1)

          parsed = urlsplit(raw.replace("postgresql+psycopg://", "postgresql://", 1))
          print(f"host={parsed.hostname or 'unknown'}")
          print(f"port={parsed.port or 'default'}")
          print(f"username={parsed.username or 'unknown'}")

          url = raw
          if url.startswith("postgresql://"):
              url = url.replace("postgresql://", "postgresql+psycopg://", 1)
          try:
              engine = create_engine(url, pool_pre_ping=True, connect_args={"connect_timeout": 15})
              with engine.connect() as connection:
                  connection.execute(text("select 1"))
              print("result=success")
          except Exception as exc:
              message = str(exc)
              if parsed.password:
                  message = message.replace(parsed.password, "***")
              print("result=failed")
              print(f"error_type={type(exc).__name__}")
              print(f"error={message[-1500:]}")
              sys.exit(1)
          PY

      - name: Upload connection diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: connection-diagnostics
          path: diagnostics/connection.txt
          retention-days: 1

      - name: Import 2025 validation season
        id: import
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          mkdir -p diagnostics
          python -m ingestion.load_nflverse --start-season 2025 --end-season 2025 > diagnostics/import.txt 2>&1

      - name: Upload import diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: import-diagnostics
          path: diagnostics/import.txt
          if-no-files-found: ignore
          retention-days: 1

      - name: Fail when import validation failed
        if: always()
        run: test "${{ steps.import.outcome }}" = "success"
