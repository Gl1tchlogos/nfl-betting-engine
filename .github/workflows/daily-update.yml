name: Daily NFL update
on:
  workflow_dispatch:
  schedule:
    - cron: "20 11 * * *"

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - run: python -m ingestion.load_nflverse --start-season 2026 --end-season 2026
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
