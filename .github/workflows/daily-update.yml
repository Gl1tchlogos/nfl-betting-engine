name: Daily NFL update

on:
  workflow_dispatch:
  schedule:
    - cron: "20 11 * * *"

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip -q install "pandas>=2.2" "pyarrow>=17" "httpx>=0.27"
      - name: Import current NFL season
        env:
          SUPABASE_URL: https://rhesgemopvbtwgcytapq.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python -m ingestion.load_nflverse --start-season 2026 --end-season 2026
