[project]
name = "nfl-betting-engine"
version = "0.1.0"
description = "NFL historical database and betting analytics API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "pandas>=2.2",
  "pyarrow>=17",
  "httpx>=0.27",
  "pydantic-settings>=2.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.6"]

[tool.ruff]
line-length = 100
